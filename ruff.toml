line-length = 120
target-version = "py312"
src = [".", "identity", "sdk/python/src", "sdk/python/tests"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC"]
ignore = ["E501", "S101"]  # long lines handled by the formatter; asserts are fine in tests

[lint.per-file-ignores]
"tests/**" = ["S", "B"]
"sdk/python/tests/**" = ["S", "B"]
"sdk/example/**" = ["B008"]  # FastAPI idiom: Depends(...) as a default

[format]
quote-style = "double"
