[project]
name = "vetfab-identity-adapter"
version = "0.1.0"
description = "Backend adapter for the Vetfab identity service: verifies its access tokens and protects a service's endpoints."
requires-python = ">=3.12"
dependencies = [
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vetfab_identity_adapter"]
