[project]
name = "vetfab-identity"
version = "0.1.0"
description = "Vetfab identity service: sign-in, RS256 access tokens, JWKS and refresh sessions (plan §28, D-11 revised; audit H8)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "psycopg[binary,pool]>=3.2",
  "sqlalchemy>=2.0.32",
  "alembic>=1.13",
  "pyjwt[crypto]>=2.9",
  "argon2-cffi>=23.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.scripts]
identity-admin = "identity.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["identity"]

[tool.uv.sources]
vetfab-authz = { path = "../../packages/authz", editable = true }

[dependency-groups]
dev = [
  # The tests verify every minted token with the API's own verifier.
  "vetfab-authz",
  "httpx>=0.27",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pyright>=1.1.380",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["db: needs the Postgres test database (docker compose -f infra/local/docker-compose.yml up -d)"]

[tool.pyright]
include = ["identity", "tests", "migrations"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
